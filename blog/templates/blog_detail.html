<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ blog.title }}</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background:#f5f7fb;
            color:#111827;
        }

        /* Navbar */

        .navbar{
            background:#111827;
            color:white;
            padding:20px 6%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
        }

        .logo{
            font-size:28px;
            font-weight:bold;
        }

        .home-btn{
            padding:10px 18px;
            background:#2563eb;
            color:white;
            text-decoration:none;
            border-radius:6px;
            transition:0.3s;
        }

        .home-btn:hover{
            background:#1d4ed8;
        }

        /* Main Blog Container */

        .blog-container{
            width:85%;
            max-width:1000px;
            margin:40px auto;
            background:white;
            border-radius:14px;
            overflow:hidden;
            box-shadow:0px 2px 15px rgba(0,0,0,0.1);
        }

        .blog-image img{
            width:100%;
            height:420px;
            object-fit:cover;
        }

        .blog-content{
            padding:35px;
        }

        .category{
            display:inline-block;
            background:#dbeafe;
            color:#1d4ed8;
            padding:6px 14px;
            border-radius:20px;
            font-size:14px;
            font-weight:bold;
            margin-bottom:18px;
        }

        .blog-title{
            font-size:42px;
            margin-bottom:20px;
            line-height:1.3;
        }

        .blog-text{
            font-size:18px;
            line-height:1.9;
            color:#374151;
        }

        .blog-text h1,
        .blog-text h2,
        .blog-text h3{
            margin-top:25px;
            margin-bottom:15px;
            color:#111827;
        }

        .blog-text p{
            margin-bottom:18px;
        }

        .blog-text ul,
        .blog-text ol{
            margin-left:25px;
            margin-bottom:18px;
        }

        .blog-text table{
            width:100%;
            border-collapse:collapse;
            margin:20px 0;
        }

        .blog-text table,
        .blog-text th,
        .blog-text td{
            border:1px solid #d1d5db;
            padding:10px;
        }

        /* Back Button */

        .back-section{
            text-align:center;
            margin:30px 0 50px;
        }

        .back-btn{
            padding:12px 22px;
            background:#111827;
            color:white;
            text-decoration:none;
            border-radius:8px;
            transition:0.3s;
        }

        .back-btn:hover{
            background:black;
        }

        /* Footer */

        .footer{
            background:#111827;
            color:white;
            text-align:center;
            padding:25px;
            margin-top:40px;
        }

        .footer p{
            margin-top:8px;
            color:#d1d5db;
        }

        /* Mobile Responsive */

        @media(max-width:768px){

            .navbar{
                flex-direction:column;
                text-align:center;
                gap:15px;
            }

            .blog-container{
                width:95%;
            }

            .blog-image img{
                height:250px;
            }

            .blog-content{
                padding:22px;
            }

            .blog-title{
                font-size:28px;
            }

            .blog-text{
                font-size:16px;
            }

        }

    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">
            JobPortal
        </div>

        <a href="/" class="home-btn">
            Back to Homepage
        </a>

    </div>

    <div class="blog-container">

        <div class="blog-image">
            <img src="{{ blog.image.url }}" alt="">
        </div>

        <div class="blog-content">

            <p class="category">{{ blog.category }}</p>

            <h1 class="blog-title">
                {{ blog.title }}
            </h1>

            <div class="blog-text">
                {{ blog.content|safe }}
            </div>

        </div>

    </div>

    <div class="back-section">

        <a href="/" class="back-btn">
            ← Back to Homepage
        </a>

    </div>

    <div class="footer">

        <h2>JobPortal</h2>

        <p>Latest Jobs • Results • Admit Cards</p>

        <p>© 2026 All Rights Reserved</p>

    </div>

</body>

</html>
